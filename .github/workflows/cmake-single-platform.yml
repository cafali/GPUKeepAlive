
name: GPUKeepAlive Windows Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Compile Release
        run: cmake --build build --config Release --parallel

      # Verify embedded Windows version information
      - name: Verify EXE metadata
        shell: pwsh
        run: |
          $exe = "build/Release/GPUKeepAlive.exe"

          if (!(Test-Path $exe)) {
              throw "Executable not found: $exe"
          }

          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
              (Resolve-Path $exe).Path
          )

          Write-Host "========== GPUKEEPALIVE METADATA =========="
          Write-Host "Company:        $($info.CompanyName)"
          Write-Host "Description:    $($info.FileDescription)"
          Write-Host "File Version:   $($info.FileVersion)"
          Write-Host "Product:        $($info.ProductName)"
          Write-Host "Product Version:$($info.ProductVersion)"
          Write-Host "Copyright:      $($info.LegalCopyright)"
          Write-Host "==========================================="

          if ($info.FileVersion -ne "1.0.3.0") {
              throw "VERSIONINFO missing or incorrect!"
          }

          if ($info.ProductName -ne "GPUKeepAlive") {
              throw "ProductName missing or incorrect!"
          }

          Write-Host "EXE metadata successfully verified."

      # Prepare portable package
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $PWD "package"
          $appDir = Join-Path $root "GPUKeepAlive"

          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $appDir | Out-Null

          $requiredFiles = @(
              "build/Release/GPUKeepAlive.exe",
              "LICENSE",
              "uninstall.bat"
          )

          foreach ($file in $requiredFiles) {
              if (!(Test-Path $file)) {
                  throw "Required package file missing: $file"
              }

              Copy-Item $file $appDir/
          }

          Copy-Item "Setup.bat" $root\setup.bat

          if (!(Test-Path "$root\setup.bat")) {
              throw "setup.bat was not placed at the root of the archive."
          }

          Write-Host "Portable package contents:"
          Get-ChildItem $root -Force

          Write-Host "Package layout:"
          Get-ChildItem $root -Recurse | Select-Object FullName

          Get-ChildItem $root -Recurse | ForEach-Object {
              Write-Host $_.FullName
          }

      # Upload the package contents. GitHub creates the single downloadable artifact ZIP.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPUKeepAlive-1.0.3
          path: package/**
          if-no-files-found: error
          retention-days: 30
